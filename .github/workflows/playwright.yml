name: Automacao Airline Manager 4
on:
  workflow_dispatch:
    inputs:
      aktifkan_random_delay:
        description: 'Ativar atraso aleatorio na execucao manual (padrao: desligado)'
        type: boolean
        required: false
        default: true
      paksa_simpan_video:
        description: 'Gravar video da execucao (padrao: desligado)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '7,37 * * * *' # A cada 30 minutos (UTC)

jobs:
  test:
    timeout-minutes: 29
    runs-on: ubuntu-22.04
    
    # Permissao para atualizar o arquivo de atividade do repositorio
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Atraso aleatorio opcional
      # Executar atraso somente quando ativado manualmente
      if: github.event_name == 'workflow_dispatch' && inputs.aktifkan_random_delay == true
      run: |
         DELAY=$(( RANDOM % 1500 ))
         echo "Aguardando $DELAY segundos..."
         sleep $DELAY

    - uses: actions/setup-node@v4
      with:
        node-version: '22' # Aman dari bug freeze ekstraksi ZIP

    - name: Instalar dependencias
      run: npm ci

    - name: Identificar versao do Playwright
      id: pw-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

    - name: Desativar atualizacao automatica do Man-DB
      run: |
        sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
        sudo dpkg-reconfigure man-db

    - name: Instalar Chromium e dependencias
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npx playwright install --with-deps chromium

    - name: Instalar servidor de tela virtual Xvfb
      # Xvfb fornece uma tela virtual para o navegador
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Criar arquivo de configuracao .env
      run: |
        touch .env
        echo "EMAIL=${{ secrets.EMAIL }}" >> .env
        echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        echo "MAX_FUEL_PRICE=${{ vars.MAX_FUEL_PRICE }}" >> .env
        echo "MAX_CO2_PRICE=${{ vars.MAX_CO2_PRICE }}" >> .env
        echo "INCREASE_AIRLINE_REPUTATION=${{ vars.INCREASE_AIRLINE_REPUTATION }}" >> .env
        echo "CAMPAIGN_TYPE=${{ vars.CAMPAIGN_TYPE }}" >> .env
        echo "CAMPAIGN_DURATION=${{ vars.CAMPAIGN_DURATION }}" >> .env
        # Variaveis de manutencao configuradas no GitHub
        echo "REPAIR_WEAR=${{ vars.REPAIR_WEAR }}" >> .env
        echo "HOURS_CHECK=${{ vars.HOURS_CHECK }}" >> .env

    - name: Executar bot Airline Manager 4
      env:
        PAKSI_VIDEO: ${{ github.event.inputs.paksa_simpan_video }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test --headed
      
    - name: Enviar relatorios da execucao
      uses: actions/upload-artifact@v4
      if: always() # Sempre guardar resultados para diagnostico
      with:
        name: playwright-report
        path: test-results/
        retention-days: 7

    # Atualizar arquivo de atividade caso tenha sido modificado
    - name: Manter repositorio ativo
      if: always()
      run: |
        # Configurar identidade do Git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Verificar se last-commit.txt foi modificado
        if [ -f "last-commit.txt" ] && git status --porcelain | grep -q "last-commit.txt"; then
          echo "Alteracoes identificadas em last-commit.txt. Registrando commit automatico..."
          git add last-commit.txt
          # Evitar disparar novas execucoes com o commit automatico
          git commit -m "chore: keepalive update [skip ci]"
          git push
        else
          echo "Nenhuma alteracao em last-commit.txt. Nenhum commit necessario."
        fi
        
